name: Daily TestFlight Build

on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC daily
  workflow_dispatch:       # allow manual trigger

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch

      - name: Download iOS Platform
        run: |
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane
        run: bundle install

      - name: Set up SSH key for Match
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${MATCH_SSH_PRIVATE_KEY}" > ~/.ssh/match_deploy
          chmod 600 ~/.ssh/match_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "Host github.com
            IdentityFile ~/.ssh/match_deploy
            StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Run Fastlane beta lane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane beta
