name: Daily TestFlight Build

on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC daily
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          LAST_RUN_TIME=$(gh run list \
            --workflow=testflight.yml \
            --branch=main \
            --status=success \
            --limit=1 \
            --json=createdAt \
            --jq='.[0].createdAt' 2>/dev/null || echo "")
          if [ -z "$LAST_RUN_TIME" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            COUNT=$(git log --oneline --since="$LAST_RUN_TIME" | wc -l | tr -d ' ')
            echo "Commits since last successful run: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "No new commits — skipping build."
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-and-upload:
    name: TestFlight Build
    needs: check-for-changes
    if: needs.check-for-changes.outputs.should_run == 'true'
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=$(ls -d /Applications/Xcode*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -1)
          fi
          echo "Selecting: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version

      - name: Download iOS Platform
        run: |
          xcrun simctl list runtimes
          xcodebuild -downloadPlatform iOS

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane
        run: bundle install

      - name: Set up SSH key for Match
        env:
          MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${MATCH_SSH_PRIVATE_KEY}" > ~/.ssh/match_deploy
          chmod 600 ~/.ssh/match_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "Host github.com
            IdentityFile ~/.ssh/match_deploy
            StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Setup Code Signing
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane setup_signing

      - name: Bump Build Number
        if: github.event_name != 'pull_request'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane bump_version

      - name: Build App
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane build_ipa

      - name: Upload to TestFlight
        if: github.event_name != 'pull_request'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane upload_beta
