name: Daily TestFlight Build

on:
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC daily
  workflow_dispatch:       # allow manual trigger

jobs:
  build-and-upload:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane
        run: bundle install

      - name: Configure git credentials for Match
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          git config --global url."https://cranberrymuffin:${MATCH_GIT_PAT}@github.com/cranberrymuffin/boop-certs".insteadOf "https://github.com/cranberrymuffin/boop-certs"

      - name: Run Fastlane beta lane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane beta
